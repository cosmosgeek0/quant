<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  /* Topbar geometry measured off learn.chatgpt.com at 100% (dpr 1):
     bar 64px, bottom hairline 1px @ 5% black, brand mark 24px tall,
     24px from the left edge, vertically centered.
     Lockup is composed from two exact-ink crops of the owner's
     Quant.png (never redrawn, never typed): lockup-mark.png 775x836
     and lockup-word.png 775x182, split at the file's own 55px gap.
     Mark and wordmark are sized independently, like any real lockup. */
  .topbar {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    background: #ffffff;
    border-bottom: 1px solid rgba(13, 13, 13, 0.05);
  }
  .brand-lockup { display: flex; align-items: center; gap: 10px; }
  .brand-lockup .mark { display: block; height: 24px; width: auto; }
  .brand-lockup .word { display: block; height: 15px; width: auto; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand-lockup">
    <img class="mark" src="lockup-mark.png" alt="">
    <img class="word" src="lockup-word.png" alt="Quant">
  </span>
</header>
</body>
</html>
