<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  /* Topbar geometry measured off learn.chatgpt.com at 100% (dpr 1):
     bar 64px, bottom hairline 1px @ 5% black, brand mark 24px tall,
     24px from the left edge, vertically centered.
     Our lockup file (1754x1241, ink bbox x 74..1678 y 203..1038, ink
     margins symmetric) shows 24px of ink at a 35.6px box height; its
     own 2.1px internal left margin makes 22px padding land the ink at
     x=24. Image used as-is — mark and wordmark scale together. */
  .topbar {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 24px 0 22px;
    background: #ffffff;
    border-bottom: 1px solid rgba(13, 13, 13, 0.05);
  }
  .brand { display: block; height: 35.6px; width: auto; }
</style>
</head>
<body>
<header class="topbar">
  <img class="brand" src="brand.png" alt="Quant">
</header>
</body>
</html>
