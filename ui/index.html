<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant</title>
<link rel="stylesheet" href="vendor/uPlot.min.css">
<style>
  /* Quant owner shell v5 — adds the bottom profile + account popup
     (platform.openai.com pattern): hover the avatar for the popup
     (identity, theme trio, settings, language, log out), click it for
     the settings route. Light is home; dark is a real, tuned theme —
     brand ink inverts at display time, the artwork files untouched. */
  @font-face {
    font-family: "InterVariable";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JBMono";
    src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JBMono";
    src: url("fonts/JetBrainsMono-Medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #0d0d0d;
    --muted: #5d5d5d;
    --faint: #b9bbc0;
    --line: rgba(13, 13, 13, 0.07);
    --line-2: rgba(13, 13, 13, 0.12);
    --pill: #ededed;
    --hover: #f5f5f5;
    --focus: #2557d6;
    --t: 130ms cubic-bezier(0.2, 0, 0, 1);
    --mono: "JBMono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html[data-theme="dark"] {
    --bg: #111318;
    --panel: #171a20;
    --ink: #e8eaef;
    --muted: #9aa0ab;
    --faint: #565c66;
    --line: rgba(255, 255, 255, 0.08);
    --line-2: rgba(255, 255, 255, 0.14);
    --pill: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.06);
    --focus: #7d9bff;
  }
  html[data-theme="dark"] .mark,
  html[data-theme="dark"] .word { filter: invert(1); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.5 InterVariable, Inter, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 6px; }
  button { font: inherit; color: inherit; }

  .frame { display: flex; min-height: 100vh; }

  .side {
    flex: none;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 14px 0 14px;
    width: 64px;
    transition: width 200ms cubic-bezier(0.2, 0, 0, 1);
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .side-top { display: flex; align-items: center; justify-content: center; min-height: 40px; }
  .brand-btn {
    display: flex; align-items: center; gap: 10px;
    background: none; border: 0; padding: 4px;
    border-radius: 9px;
    cursor: pointer;
    transition: background var(--t), transform var(--t);
  }
  .side[data-state="collapsed"] .brand-btn:hover { background: var(--hover); transform: scale(1.04); }
  .side[data-state="collapsed"] .brand-btn:active { transform: scale(0.97); }
  .brand-btn .mark { display: block; height: 32px; width: auto; }
  .brand-btn .word { display: none; height: 14px; width: auto; }

  .side-collapse {
    display: none;
    width: 32px; height: 32px;
    align-items: center; justify-content: center;
    background: none; border: 0; padding: 0;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: background var(--t), color var(--t), transform var(--t);
  }
  .side-collapse:hover { background: var(--hover); color: var(--ink); }
  .side-collapse:active { transform: scale(0.94); }
  .side-collapse svg { width: 17px; height: 17px; stroke-width: 1.5; }

  .side[data-state="expanded"] { width: 184px; }
  .side[data-state="expanded"] .side-top {
    justify-content: flex-start;
    padding: 0 10px 0 14px;
  }
  .side[data-state="expanded"] .brand-btn { cursor: default; flex: 1; }
  .side[data-state="expanded"] .brand-btn .mark { height: 28px; }
  .side[data-state="expanded"] .brand-btn .word { display: block; }
  .side[data-state="expanded"] .side-collapse { display: flex; }

  .side nav { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; align-items: center; }
  .nav-row {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: 10px;
    color: var(--muted);
    text-decoration: none;
    transition: background var(--t), color var(--t), transform var(--t);
  }
  .nav-row .nm { display: none; font-size: 13.5px; }
  a.nav-row:hover { background: var(--hover); color: var(--ink); transform: translateX(1px); }
  a.nav-row:active { transform: scale(0.97); }
  .nav-row.active { background: var(--pill); color: var(--ink); }
  .nav-row svg { width: 22px; height: 22px; stroke-width: 1.5; flex: none; transition: transform var(--t); }
  a.nav-row:hover svg { transform: scale(1.06); }

  .side[data-state="expanded"] nav { align-items: stretch; padding: 0 10px; }
  .side[data-state="expanded"] .nav-row {
    width: auto;
    justify-content: flex-start;
    gap: 10px;
    padding: 0 10px;
  }
  .side[data-state="expanded"] .nav-row .nm { display: inline; }
  .nav-row.sig-ok svg { color: #2ebd85; }
  .nav-row.sig-stale svg { color: #99640a; }
  .nav-row.sig-bad svg { color: #cc2f3c; }
  .side[data-state="expanded"] .nav-row.active .nm { font-weight: 500; }

  /* bottom profile */
  .profile {
    margin-top: auto;
    display: flex; align-items: center; justify-content: center;
    align-self: center;
    width: 44px; height: 44px;
    background: none; border: 0; padding: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background var(--t), transform var(--t);
  }
  .profile:hover { background: var(--hover); }
  .profile:active { transform: scale(0.96); }
  .avatar {
    position: relative;
    width: 34px; height: 34px;
    border-radius: 50%;
    flex: none;
    background: #16255f url("avatar.png") center / cover no-repeat;
  }
  .avatar::after {
    content: "";
    position: absolute;
    right: -2px; bottom: -2px;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #23262c; /* black = offline */
    border: 2.5px solid var(--bg);
    transition: background var(--t);
  }
  .avatar.on::after { background: #2ebd85; /* green = online */ }
  .profile .pcol { display: none; min-width: 0; text-align: left; }
  .side[data-state="expanded"] .profile {
    align-self: stretch;
    width: auto;
    margin: auto 10px 0;
    justify-content: flex-start;
    gap: 11px;
    padding: 0 8px;
    height: 56px;
  }
  .side[data-state="expanded"] .profile .avatar { width: 32px; height: 32px; }
  .side[data-state="expanded"] .profile .pcol { display: flex; flex-direction: column; line-height: 1.4; gap: 1px; }
  .profile .pname { font-size: 14px; font-weight: 500; color: var(--ink); }
  .profile .prole { font-size: 12px; color: var(--muted); }

  main { flex: 1; min-width: 0; }


  /* Connections page — one centered measured column, symmetric
     padding, hairlines only inside the list. No boxes. */
  .conn-page { max-width: 1280px; margin: 0; padding: 72px 40px 56px; }
  .conn-tiles {
    display: flex; gap: 0; margin-top: 22px;
    border: 1px solid var(--line-2); border-radius: 14px;
    overflow: hidden;
  }
  .conn-tile { flex: 1; padding: 13px 16px; border-right: 1px solid var(--line); min-width: 0; }
  .conn-tile:last-child { border-right: 0; }
  .conn-tile em {
    display: block; font-style: normal;
    font-size: 9.75px; font-weight: 500; letter-spacing: 0.045em;
    text-transform: uppercase; color: var(--muted); line-height: 13px;
  }
  .conn-tile b {
    display: block; margin-top: 2px;
    font-family: var(--mono);
    font-size: 17px; font-weight: 400; color: var(--ink);
    line-height: 24px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* nominal tile values stay ink (DESIGN.md §2) — only deviation colors */
  .conn-tile b.warn { color: #d4a406; }
  .conn-tile b.bad { color: #cc2f3c; }
  .conn-tile small {
    display: block; margin-top: 1px;
    font-size: 10.5px; color: var(--faint); line-height: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .machine-chip {
    display: inline-flex; align-items: center; gap: 7px;
    height: 28px; padding: 0 11px;
    border: 1px solid var(--line-2); border-radius: 999px;
    font-size: 9.75px; font-weight: 500; letter-spacing: 0.045em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .machine-chip b { font-family: var(--mono); font-weight: 400; font-size: 12.5px; color: var(--ink); }
  .machine-chip b.warn { color: #d4a406; }
  .machine-chip b.bad { color: #cc2f3c; }
  .conn-assessed { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .conn-defaults {
    height: 30px; padding: 0 12px;
    border: 1px solid var(--line-2); border-radius: 8px;
    background: none; color: var(--muted);
    font: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    transition: background var(--t), color var(--t);
  }
  .conn-defaults:hover { background: var(--hover); color: var(--ink); }
  .conn-overall {
    display: inline-flex; align-items: center; gap: 7px;
    margin-left: auto;
    font-size: 9.75px; font-weight: 500; letter-spacing: 0.045em;
    text-transform: uppercase;
    color: var(--muted);
  }
  /* the page lamp: solid state glyph, no pulse — deviation classes
     stay loud. Same green as the row dots: one status green everywhere. */
  .conn-overall .livedot {
    width: 8px; height: 8px;
    background: #16a34a;
    animation: none;
  }
  .conn-head-row { display: flex; align-items: center; gap: 14px; }
  .conn-title { font-size: 16px; font-weight: 600; color: var(--ink); }
  .conn-sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
  /* News v4 — decongested top, two-column body: list left, dedicated
     Sources box + Activity box on the right (owner-sanctioned boxes:
     functional containers, 1px line, small radius). */
  .news-page { max-width: none; margin: 0; padding: 72px 40px 56px; }
  .news-head { display: flex; align-items: center; gap: 14px; }
  .news-title { font-size: 26px; font-weight: 650; color: var(--ink); letter-spacing: -0.015em; }
  .news-live { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums lining-nums; }
  .news-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .refresh-btn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0;
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    transition: background var(--t), color var(--t);
  }
  .refresh-btn:hover { background: var(--hover); color: var(--ink); }
  .refresh-btn svg { width: 15px; height: 15px; stroke-width: 1.6; }
  .refresh-btn.busy svg { animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .news-upd { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums lining-nums; }
  .news-upd.stale { color: #d4a406; }
  .bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .master-wrap { display: flex; align-items: center; gap: 8px; }
  .master-wrap .mlabel { font-size: 12.5px; color: var(--muted); }
  .livewrap { display: flex; align-items: center; gap: 7px; }
  .livedot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #16a34a;
    animation: livepulse 1.6s ease-in-out infinite;
  }
  .livedot.stale { background: #d4a406; animation: none; }
  .livedot.dead { background: #b3564d; animation: none; }
  @keyframes livepulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }
  @media (prefers-reduced-motion: reduce) {
    .livedot { animation: none; }
  }
  .livelabel { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .refresh-btn.kick svg { animation: spin 600ms cubic-bezier(0.2, 0, 0.2, 1); }

  .strip-row { display: flex; align-items: center; gap: 18px; margin-top: 22px; }
  .strip-row .news-right { align-self: center; }
  .daystrip { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .day {
    border: 1px solid var(--line-2);
    border-radius: 12px;
    background: none;
    padding: 11px 18px 12px;
    min-width: 122px;
    cursor: pointer;
    text-align: left;
    transition: background var(--t), border-color var(--t);
  }
  .day:hover { background: var(--hover); }
  .day.on { background: var(--pill); border-color: transparent; }
  .day.dim { opacity: 0.45; }
  .day .d1 { display: block; font-size: 13px; font-weight: 600; color: var(--ink); }
  .day .d2 { display: flex; gap: 9px; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums lining-nums; align-items: baseline; }
  .day .d2 .lt { font-size: 12.5px; font-weight: 650; }
  .day .d2 .lt.h { color: #16a34a; }
  .day .d2 .lt.m { color: #3b82f6; }
  .day .d2 .lt.l { color: #d4a406; }
  .day .d2 .nm2 { font-size: 10.5px; color: var(--muted); margin-left: 2px; }

  .pillbar { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .fpill {
    height: 31px; padding: 0 14px;
    border: 0; border-radius: 999px;
    background: none;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    cursor: pointer;
    transition: background var(--t), color var(--t);
  }
  .fpill:hover { background: var(--hover); color: var(--ink); }
  .fpill.on {
    background: var(--pill);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line-2);
  }
  .fpill .cnt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .bars { width: 11px; height: 10px; flex: none; }
  .bars rect { fill: var(--faint); }
  .bars.b3 rect { fill: #16a34a; }
  .bars.b2 rect.r1, .bars.b2 rect.r2 { fill: #3b82f6; }
  .bars.b1 rect.r1 { fill: #eab308; }

  .news-cols { display: flex; gap: 32px; margin-top: 22px; align-items: flex-start; }
  .news-maincol { flex: 1; min-width: 0; }
  .news-rightcol {
    width: 392px; flex: none;
    display: flex; flex-direction: column; gap: 20px;
  }
  .rbox {
    border: 1px solid var(--line-2);
    border-radius: 16px;
    padding: 18px;
    background: var(--panel);
  }
  .rbox-h { display: flex; align-items: baseline; padding: 2px 2px 12px; }
  .rbox-title { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .rbox-sub { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .srcsearch {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-2);
    border-radius: 10px;
    padding: 0 12px;
    height: 34px;
  }
  .srcsearch svg { width: 13px; height: 13px; stroke-width: 1.8; color: var(--muted); flex: none; }
  .srcsearch input { border: 0; outline: 0; background: none; font: inherit; font-size: 12.5px; color: var(--ink); width: 100%; }
  .srclist { margin-top: 8px; max-height: 420px; overflow-y: auto; padding-right: 12px; scrollbar-gutter: stable; }
  .src-row { display: flex; align-items: center; gap: 11px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .src-row:last-child { border-bottom: 0; }
  .src-name { flex: 1; min-width: 0; font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-row.off .src-name { color: var(--faint); }
  .src-row.off .fav, .src-row.off .badge { opacity: 0.4; }
  .src-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--faint);
    flex: none;
  }
  .src-dot.live { background: #2ebd85; border-color: #2ebd85; }
  .src-dot.delayed { background: var(--faint); border-color: var(--faint); }
  .src-dot.error { background: #b3564d; border-color: #b3564d; }
  .src-cnt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 22px; text-align: right; }
  .sp-note { margin-top: 9px; font-size: 10.5px; color: var(--faint); line-height: 1.45; }

  .fav { width: 22px; height: 22px; border-radius: 5px; flex: none; display: block; }
  .news-row .fav, .news-row .badge { width: 15px; height: 15px; border-radius: 4px; font-size: 8px; }
  .badge {
    width: 22px; height: 22px; flex: none;
    border-radius: 5px;
    background: var(--pill);
    color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: 600;
  }

  .hbar-row { display: flex; align-items: center; gap: 11px; padding: 7px 0; }
  .hbar-label { width: 116px; flex: none; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-track { flex: 1; height: 10px; border-radius: 5px; background: var(--inset, var(--hover)); position: relative; }
  .hbar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: rgba(59, 130, 246, 0.55); }
  .hbar-val { width: 38px; flex: none; text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .act-h { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .act-h .lg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .act-h .dotc { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .actchart { display: block; width: 100%; height: 118px; margin-top: 12px; }
  .actchart .bl { stroke: var(--line-2); }
  .acthour { font-size: 9px; fill: var(--muted); }

  .news-list { margin-top: 2px; }
  .news-hrow, .news-row {
    display: grid;
    grid-template-columns: 56px 20px 204px 1fr 108px 26px;
    gap: 14px;
    align-items: center;
  }
  .news-hrow {
    padding: 8px 2px 7px;
    border-bottom: 1px solid var(--line);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--muted);
  }
  .news-row { padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .news-row:hover { background: var(--hover); }
  .news-row.fresh { animation: freshfade 1.8s ease-out; }
  @keyframes freshfade {
    from { background: rgba(37, 87, 214, 0.10); }
    to { background: transparent; }
  }
  .n-time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums lining-nums; }
  .n-srcwrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .n-srccol { min-width: 0; line-height: 1.25; }
  .n-src { display: block; font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n-dom { display: block; font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n-head { min-width: 0; }
  .n-head a, .n-head span {
    font-size: 13.5px; color: var(--ink);
    text-decoration: none;
    display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .n-head a:hover { text-decoration: underline; }
  .n-cat { font-size: 12px; color: var(--muted); text-align: left; }
  .n-link { display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .n-link a { color: inherit; display: flex; }
  .n-link svg { width: 13px; height: 13px; stroke-width: 1.7; }
  .n-link a:hover { color: var(--ink); }
  .news-empty { margin-top: 22px; font-size: 13px; color: var(--muted); }

  .pager { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
  .pbtn {
    min-width: 30px; height: 30px; padding: 0 9px;
    border: 0; border-radius: 8px;
    background: none;
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background var(--t), color var(--t);
  }
  .pbtn:hover { background: var(--hover); color: var(--ink); }
  .pbtn.on { background: var(--pill); color: var(--ink); font-weight: 600; }
  .pbtn[disabled] { opacity: 0.35; cursor: default; }
  .pager .pinfo { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .newsearch {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-2);
    border-radius: 10px;
    padding: 0 12px;
    height: 34px;
    width: 392px;
    transition: border-color var(--t), box-shadow var(--t);
  }
  .newsearch:focus-within {

  .qsearch {

  /* paired light beams — the old code's final search animation: twin
     streaks sweep the pill's top and bottom edges, calm at idle,
     vivid while open. Exact keyframes and gradients from source. */
  .qsearch {
    --search-beam-speed: 10s;
    --search-beam-width: 34%;
    --search-beam-size: 1px;
    --search-beam-peak: 0.34;
    --search-beam-shadow: 0.10;
  }
  .qsearch.open {
    --search-beam-speed: 4.8s;
    --search-beam-width: 30%;

    --search-beam-peak: 0.94;
    --search-beam-shadow: 0.30;
  }
  .search-beam {
    position: absolute;
    inset: 0;
    display: block;
    overflow: hidden;
    border-radius: 999px;
    pointer-events: none;
    z-index: 8;
  }
  .search-beam::before,
  .search-beam::after {
    content: "";
    position: absolute;
    left: 0;
    width: var(--search-beam-width);
    height: var(--search-beam-size);
    border-radius: 999px;
    opacity: 0;
    transform: translate3d(-128%, 0, 0);
    will-change: transform, opacity;
    background:
      radial-gradient(circle at 88% 50%, rgba(255, 255, 255, calc(var(--search-beam-peak) * 0.96)) 0 1.5px, transparent 3px),
      linear-gradient(90deg,
        transparent 0%,
        rgba(56, 189, 248, 0) 12%,
        rgba(56, 189, 248, calc(var(--search-beam-peak) * 0.26)) 34%,
        rgba(37, 99, 235, calc(var(--search-beam-peak) * 0.62)) 66%,
        rgba(255, 255, 255, calc(var(--search-beam-peak) * 0.90)) 86%,
        transparent 100%);
    box-shadow:
      0 0 7px rgba(56, 189, 248, var(--search-beam-shadow)),
      0 0 12px rgba(37, 99, 235, calc(var(--search-beam-shadow) * 0.72));
    animation: searchPairedBeamIdle var(--search-beam-speed) cubic-bezier(0.22, 0.82, 0.18, 1) infinite;
  }
  .search-beam::before { top: 1px; }
  .search-beam::after { bottom: 1px; animation-delay: 0.04s; }
  .qsearch.open .search-beam::before,
  .qsearch.open .search-beam::after {
    animation-name: searchPairedBeamActive;
  }
  @keyframes searchPairedBeamIdle {
    0%, 68%, 100% { opacity: 0; transform: translate3d(-128%, 0, 0); }
    5% { opacity: calc(var(--search-beam-peak) * 0.54); }
    13% { opacity: var(--search-beam-peak); }
    25% { opacity: calc(var(--search-beam-peak) * 0.68); }
    31% { opacity: 0; transform: translate3d(334%, 0, 0); }
  }
  @keyframes searchPairedBeamActive {
    0%, 80%, 100% { opacity: 0; transform: translate3d(-132%, 0, 0); }
    7% { opacity: calc(var(--search-beam-peak) * 0.74); }
    18%, 43% { opacity: var(--search-beam-peak); }
    60% { opacity: 0; transform: translate3d(342%, 0, 0); }
  }
  html[data-theme="dark"] .qsearch .search-beam::before,
  html[data-theme="dark"] .qsearch .search-beam::after,
  html[data-theme="dark"] .qsearch.open .search-beam::before,
